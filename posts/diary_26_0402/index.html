<h1> わさびを堪能するなどした </h1>
<p>我が祖国には、日本の誇るわさびの農場がある。大王わさび農場である。</p>
<p>友人とそこに行ってきた。</p>
<p>その場でおろして食べるわさびというのは初めての体験であり、とてもうまかった。
チューブのわさびとは別物である。
香りも口の中での味の時間発展の様子も違う。
感動すると同時に、チューブのわさびも結構よく頑張ってるんだなあ、とも思った。</p>
<p>そのわさびで蕎麦を頂いたが、とてもうまかった。</p>
<p>農場の中の景色もよく、住みたいと思った。</p>
