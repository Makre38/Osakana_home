<h2> ワラーチがほしくなった </h2>
<p>ベアフットという概念がある。裸足に近い履物だと色々良いよねって主張だと思ってる。
我もこの主張は結構信じていて、ALTRAの靴に手を出し…足を出したりした。
しかし、この靴は高い。こんな高いのを普段履くのはもったいない気がする。
そんな折、ワラーチという物の存在を知った。
靴のソールを買い、穴あけ、紐通す。完成。というもの。
安い、構造が簡単、ベアフット。自作せずにはいられないな!</p>
